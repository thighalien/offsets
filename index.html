<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>RXCHIE Offsets</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-soft: #161b22;
    --card: #10151c;
    --border: #21262d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent-2: #3fb950;
    --mono: ui-monospace, "Cascadia Code", Consolas, "SF Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(13, 17, 23, .92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 20px; }
  .topbar { display: flex; align-items: center; gap: 14px; padding: 14px 0; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .3px; }
  h1 span { color: var(--accent); }
  .badge {
    font: 12px var(--mono);
    color: var(--accent-2);
    border: 1px solid rgba(63, 185, 80, .4);
    background: rgba(63, 185, 80, .08);
    padding: 2px 9px; border-radius: 99px; white-space: nowrap;
  }
  .badge.blue { color: var(--accent); border-color: rgba(88,166,255,.4); background: rgba(88,166,255,.08); }
  .stats { display: flex; gap: 22px; padding: 0 0 12px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
  .stats b { color: var(--text); font-weight: 600; }
  .toolbar {
    display: flex; gap: 10px; align-items: center; margin: 18px 0 6px; flex-wrap: wrap;
  }
  input[type="search"] {
    flex: 1; min-width: 220px;
    background: var(--bg-soft); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 9px 12px; font: 14px system-ui, sans-serif; outline: none;
  }
  input[type="search"]:focus { border-color: var(--accent); }
  #status { font: 12px var(--mono); color: var(--muted); }
  .ns-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    margin: 12px 0; overflow: hidden;
  }
  .ns-head {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    border-bottom: 1px solid var(--border); cursor: pointer; user-select: none;
  }
  .ns-head .caret { color: var(--muted); transition: transform .15s; }
  .ns-card.collapsed .caret { transform: rotate(-90deg); }
  .ns-head code { font: 13px var(--mono); color: var(--accent); }
  .ns-head .count { margin-left: auto; font: 12px var(--mono); color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font: 13px var(--mono); }
  tbody { display: none; }
  .ns-card:not(.collapsed) tbody { display: table-row-group; }
  th {
    text-align: left; font-weight: 600; color: var(--muted);
    padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--bg-soft);
  }
  td { padding: 7px 16px; border-bottom: 1px solid rgba(33,38,45,.5); }
  tr:last-child td { border-bottom: 0; }
  td.name { color: var(--text); }
  td.hex { color: var(--accent-2); }
  td.dec { color: var(--muted); }
  td.str { color: #d2a8ff; }
  .copy {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; font: 11px var(--mono); padding: 2px 8px; cursor: pointer;
  }
  .copy:hover { color: var(--text); border-color: var(--accent); }
  .copy.copied { color: var(--accent-2); border-color: var(--accent-2); }
  footer {
    color: var(--muted); font-size: 12px; text-align: center;
    padding: 26px 0 34px;
  }
  footer a { color: var(--accent); text-decoration: none; }
  #empty { color: var(--muted); text-align: center; padding: 40px 0; font-size: 14px; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="topbar">
      <h1>RXCHIE<span>·</span>Offsets</h1>
      <span class="badge" id="verBadge">loading…</span>
      <span class="badge blue" id="localBadge"></span>
    </div>
    <div class="stats">
      <span>offsets <b id="statOffsets">–</b></span>
      <span>namespaces <b id="statNs">–</b></span>
      <span>dumped <b id="statTime">–</b></span>
      <span>build <b id="statBuild">–</b></span>
      <span>source <b id="statSource">–</b></span>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <input type="search" id="search" placeholder="Filter namespaces and offsets…" autocomplete="off">
    <span id="status"></span>
  </div>
  <div id="content"></div>
  <p id="empty" hidden>No offsets match the filter.</p>
</main>

<footer>
  Generated by <b>RXCHIE Custom Offsets</b> &middot;
  offsets by <a href="https://offsets.imtheo.lol/" target="_blank" rel="noopener">theo</a>
</footer>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const state = { offsets: {}, nsOrder: [], source: "–" };

/* ---------- data loading ---------- */

async function loadJSON() {
  const res = await fetch("Offsets.json", { cache: "no-store" });
  if (!res.ok) throw new Error(res.status);
  return await res.json();
}

/* Parse the plain-text header: nested namespace blocks with inline constexpr
   members. Keys carry the FULL namespace path (Offsets::Camera::Position). */
function parseHPP(text) {
  const offsets = {};
  const stack = [];
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line || line.startsWith("//") || line.startsWith("/*") || line.startsWith("#"))
      continue;
    let m = line.match(/^namespace\s+([\w:]+)\s*\{\s*$/);
    if (m) { stack.push(m[1]); continue; }
    if (line === "}") { stack.pop(); continue; }
    m = line.match(/^inline\s+(?:constexpr\s+)?uintptr_t\s+(\w+)\s*=\s*(0x[0-9a-fA-F]+|\d+)\s*;$/);
    if (m && stack.length) {
      const tok = m[2];
      offsets[stack.join("::") + "::" + m[1]] =
        tok.startsWith("0x") ? parseInt(tok, 16) : parseInt(tok, 10);
      continue;
    }
    m = line.match(/^inline\s+std::string\s+(\w+)\s*=\s*"([^"]*)"\s*;$/);
    if (m && stack.length) { offsets[stack.join("::") + "::" + m[1]] = m[2]; }
  }
  return { offsets, meta: {} };
}

async function load() {
  let data = null;
  try {
    data = await loadJSON();
    state.source = "Offsets.json";
  } catch (_) {
    try {
      const res = await fetch("Offsets.hpp", { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      data = parseHPP(await res.text());
      state.source = "Offsets.hpp (parsed)";
    } catch (e) {
      $("status").textContent =
        "Could not load Offsets.json or Offsets.hpp — open this site from the folder " +
        "(e.g. `python -m http.server`) or on GitHub Pages.";
      return;
    }
  }
  const offsets = data.offsets || {};
  const meta = data.meta || {};
  state.offsets = offsets;

  const nsSet = new Set();
  for (const key of Object.keys(offsets)) {
    const ns = key.includes("::") ? key.slice(0, key.lastIndexOf("::")) : "Offsets";
    nsSet.add(ns);
  }
  state.nsOrder = [...nsSet];

  // top-level strings (ClientVersion) belong in the header, not a namespace table
  const ver = offsets["Offsets::ClientVersion"];
  if (ver) $("verBadge").textContent = ver;
  if (meta.remote_version) $("verBadge").textContent = meta.remote_version;
  if (meta.local_version) $("localBadge").textContent = "local " + meta.local_version;
  $("statOffsets").textContent = Object.keys(offsets).length;
  $("statNs").textContent = state.nsOrder.length;
  $("statTime").textContent = meta.dumped_at || "–";
  $("statBuild").textContent = meta.local_build_id || "–";
  $("statSource").textContent = state.source;

  render();
  $("search").addEventListener("input", render);
}

/* ---------- rendering ---------- */

const esc = (s) => s.replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function rowHTML(ns, name, value) {
  const isStr = typeof value === "string";
  const valCell = isStr
    ? `<td class="str">"${esc(value)}"</td><td class="dec"></td>`
    : `<td class="hex">0x${value.toString(16).toUpperCase()}</td>` +
      `<td class="dec">${value}</td>`;
  return `<tr>
    <td class="name">${esc(name)}</td>
    ${valCell}
    <td><button class="copy" data-ref="${esc(ns)}::${esc(name)}" data-val="${esc(isStr ? value : "0x" + value.toString(16).toUpperCase())}">copy</button></td>
  </tr>`;
}

function render() {
  const q = ($("search").value || "").trim().toLowerCase();
  const host = $("content");
  host.innerHTML = "";
  let visible = 0;

  for (const ns of state.nsOrder) {
    const entries = Object.entries(state.offsets)
      .filter(([k]) => k.includes("::") && k.slice(0, k.lastIndexOf("::")) === ns)
      .map(([k, v]) => [k.slice(k.lastIndexOf("::") + 2), v]);

    const showNs = ns.toLowerCase().includes(q);
    const rows = entries.filter(([n, v]) =>
      showNs || n.toLowerCase().includes(q) || String(v).toLowerCase().includes(q));

    if (!rows.length) continue;
    visible += rows.length;

    const card = document.createElement("section");
    card.className = "ns-card";
    card.innerHTML =
      `<div class="ns-head">
         <span class="caret">▾</span>
         <code>${esc(ns)}</code>
         <span class="count">${rows.length}</span>
       </div>
       <table><thead><tr>
         <th>offset</th><th>hex</th><th>dec</th><th></th>
       </tr></thead><tbody>
         ${rows.map(([n, v]) => rowHTML(ns, n, v)).join("")}
       </tbody></table>`;
    card.querySelector(".ns-head").addEventListener("click", () =>
      card.classList.toggle("collapsed"));
    host.appendChild(card);
  }

  $("empty").hidden = visible > 0;
  $("status").textContent = visible
    ? `${visible} of ${Object.keys(state.offsets).length} offsets shown`
    : "";
}

/* ---------- copy ---------- */

document.addEventListener("click", async (e) => {
  const btn = e.target.closest(".copy");
  if (!btn) return;
  const text = `${btn.dataset.ref} = ${btn.dataset.val};`;
  try {
    await navigator.clipboard.writeText(text);
  } catch (_) {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
  btn.textContent = "copied";
  btn.classList.add("copied");
  setTimeout(() => { btn.textContent = "copy"; btn.classList.remove("copied"); }, 1200);
});

load();
</script>
</body>
</html>
